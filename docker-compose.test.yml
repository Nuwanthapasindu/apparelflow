# Throwaway Postgres for the test suite. Never used by the app itself, never Supabase.
# yarn test:db:up   -> starts it on localhost:5433 and waits until it accepts connections
# yarn test:db:down -> stops and removes it
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: apparelflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apparelflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
